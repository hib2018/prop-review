name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting, test, and vet
        run: |
          gofmt -w *.go
          git diff --exit-code -- '*.go'
          go test -race ./...
          go vet ./...
      - name: Build for macOS
        run: GOOS=darwin GOARCH=arm64 go build -o "$RUNNER_TEMP/prop-review-darwin"
